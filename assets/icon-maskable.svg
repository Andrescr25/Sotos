  <g transform="translate(512 512) scale(0.72) translate(-512 -512)">

  <!-- plato -->
  <circle cx="512" cy="512" r="215" fill="#FBEEDD"/>
  <circle cx="512" cy="512" r="165" fill="#C90000"/>
  <circle cx="512" cy="512" r="120" fill="#FBEEDD"/>

