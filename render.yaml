# Blueprint de Render: dos servicios.
#   - sotos-server: la API (Node). La base de datos vive en Supabase (Postgres);
#     aquí solo se recibe su cadena de conexión como variable de entorno.
#   - sotos-app: la app web, como sitio estático. El personal la abre desde el
#     navegador de la tablet y la agrega a la pantalla de inicio.
# Guía: docs/DESPLIEGUE_RENDER.md
#
# IMPORTANTE:
#   - El plan "free" del servicio NO sirve para un restaurante: se duerme tras
#     15 min sin tráfico y el primer pedido tardaría ~1 minuto en llegar a cocina.
#     Por eso se usa 0.5c-512mb (plan de pago de Render).
#   - Render solo tiene IPv4, y la conexión DIRECTA de Supabase es IPv6.
#     DATABASE_URL debe ser la del "Session pooler" de Supabase (puerto 5432).

services:
  - type: web
    name: sotos-server
    runtime: node
    # Misma zona que el proyecto de Supabase (us-east-2 = Ohio) para menos latencia.
    # OJO: la región NO se puede cambiar después de crear el servicio.
    region: ohio
    plan: 0.5c-512mb
    buildCommand: npm ci --prefix server && npm run build --prefix server
    startCommand: node server/dist/index.js
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: BUSINESS_TZ
        value: America/Costa_Rica
      # Dónde vive la app web. El navegador solo puede llamar a esta API desde
      # orígenes permitidos (localhost ya está permitido para desarrollo).
      # Debe coincidir con la URL de sotos-app más abajo.
      - key: CORS_ORIGIN
        value: https://sotos-app.onrender.com
      # Cadena de conexión de Supabase (Session pooler). Render la pide al crear
      # el Blueprint y no se guarda en el repositorio.
      - key: DATABASE_URL
        sync: false
      # Primer administrador. Solo se usa si todavía no existe ninguno; después
      # se pueden quitar estas variables. Render las pide al crear el Blueprint.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrador

  # La app web de caja, cocina y administración (Expo, exportada a HTML + JS).
  # Un sitio estático no tiene plan de cómputo ni región: lo sirve una CDN.
  - type: web
    name: sotos-app
    runtime: static
    buildCommand: npm ci --omit=dev && npx expo export --platform web
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22
      # Se incrusta en la app al compilarla (EXPO_PUBLIC_*): es una URL pública,
      # no un secreto. Debe ser la de sotos-server.
      - key: EXPO_PUBLIC_API_URL
        value: https://sotos-server.onrender.com
    # La app es de una sola página: toda ruta (/caja, /cocina…) debe devolver
    # index.html. Render no reescribe rutas que sí existen como archivo.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
